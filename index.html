<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Track</title>
    <link rel="icon" type="image/png" href="img/logo-task-track.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <div class="header">
            <img src="img/logo-task-track.png" alt="Task Track Logo" class="logo">
            <h1>Task Track</h1>
        </div>

        <form id="taskForm" class="input-group">

            <input type="text" id="taskInput" placeholder="Add a task" maxlength="18" autocomplete="off">
            <input type="date" id="dateInput">

            <button type="submit" title="Add task">+</button>

        </form>

        <p id="errorMsg"></p>

        <div class="filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <div class="copyright">
            &copy; 2026–Present Evan Hendra Mulyadi. All Rights Reserved.
        </div>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
