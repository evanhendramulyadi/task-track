<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Track</title>
    <link rel="icon" type="image/png" href="img/logo-task-track.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <div class="header">
            <img src="img/logo-task-track.png" alt="Task Track Logo" class="logo">
            <h1>Task Track</h1>
        </div>

        <form id="taskForm" class="input-group">

            <input type="text" id="taskInput" placeholder="Add a task" maxlength="18" autocomplete="off">
            <input type="date" id="dateInput">

            <button type="submit" title="Add task" aria-label="Add task">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>

        </form>

        <p id="errorMsg"></p>

        <div class="filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <div class="copyright">
            &copy; 2026–Present Evan Hendra Mulyadi. All Rights Reserved.
        </div>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
